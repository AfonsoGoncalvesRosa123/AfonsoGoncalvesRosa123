<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a0707"/>
      <stop offset="1" stop-color="#7a1414"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- small bar chart motif on the right -->
  <g transform="translate(905,70)" fill="#f07a6e">
    <rect x="0"   y="110" width="26" height="50"  rx="4" opacity="0.35"/>
    <rect x="40"  y="80"  width="26" height="80"  rx="4" opacity="0.45"/>
    <rect x="80"  y="95"  width="26" height="65"  rx="4" opacity="0.55"/>
    <rect x="120" y="50"  width="26" height="110" rx="4" opacity="0.65"/>
    <rect x="160" y="25"  width="26" height="135" rx="4" opacity="0.8"/>
    <rect x="200" y="0"   width="26" height="160" rx="4" opacity="0.95"/>
    <polyline points="13,100 53,70 93,85 133,40 173,15 213,-10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <circle cx="213" cy="-10" r="5" fill="#ffffff"/>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="70" y="128" font-size="60" font-weight="700">Afonso Gonçalves Rosa</text>
    <text x="72" y="178" font-size="26" fill="#f6d6d2">Data Analysis · MSc Computer Engineering</text>
    <text x="72" y="232" font-size="20" fill="#e3a39b" letter-spacing="1">SQL  ·  PYTHON  ·  SPARK  ·  POWER BI  ·  MACHINE LEARNING</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
