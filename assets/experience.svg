<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="416" viewBox="0 0 1000 416" xmlns:c2pa="http://c2pa.org/manifest"><rect x="0.5" y="0.5" width="999" height="415" rx="16" fill="#0d0d0f" stroke="#2a2a30"/><rect x="40" y="36" width="4" height="18" rx="2" fill="#e5484d"/><text x="54" y="50" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#e5484d" font-weight="700" text-anchor="start" letter-spacing="2">EXPERIENCE</text><text x="40" y="92" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" fill="#f2f2f2" font-weight="700" text-anchor="start" letter-spacing="0">Curricular Intern · RCSoft</text><text x="960" y="92" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9aa3" font-weight="400" text-anchor="end" letter-spacing="0">Coimbra · Mar - Jun 2025</text><circle cx="47" cy="123" r="3.5" fill="#e5484d"/><text x="62" y="128" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#d6d6db" font-weight="400" text-anchor="start" letter-spacing="0">Built a 6-screen maintenance app (C#, .NET MAUI, SQL Server, WebAPI) in a 370-hour internship.</text><circle cx="47" cy="151" r="3.5" fill="#e5484d"/><text x="62" y="156" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#d6d6db" font-weight="400" text-anchor="start" letter-spacing="0">Designed a live dashboard with 3 KPIs: open work orders, equipment under maintenance, fault history.</text><circle cx="47" cy="179" r="3.5" fill="#e5484d"/><text x="62" y="184" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#d6d6db" font-weight="400" text-anchor="start" letter-spacing="0">Wrote SQL queries and stored procedures; cut redundant API calls to meet a sub-2-second target.</text><line x1="40" y1="216" x2="960" y2="216" stroke="#2a2a30"/><rect x="40" y="240" width="4" height="18" rx="2" fill="#e5484d"/><text x="54" y="254" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#e5484d" font-weight="700" text-anchor="start" letter-spacing="2">PUBLICATION</text><text x="40" y="296" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#f2f2f2" font-weight="700" text-anchor="start" letter-spacing="0">Deep Learning in Logistics and Production Decision-Support Systems:</text><text x="40" y="322" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#f2f2f2" font-weight="700" text-anchor="start" letter-spacing="0">A Structured Review of Forecasting, Routing, and Hybrid Optimization</text><text x="40" y="352" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9aa3" font-weight="400" text-anchor="start" letter-spacing="0">Rosa, A. (first author), Correia, F. B., &amp; Borges, A. R. · CAPSI 2026, Coimbra</text><circle cx="47" cy="382" r="3.5" fill="#e5484d"/><text x="62" y="387" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#d6d6db" font-weight="400" text-anchor="start" letter-spacing="0">Review of 35 studies: deep learning works best alongside classical optimization, not instead of it.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>